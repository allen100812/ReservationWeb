version: '3.9'

services:
  web:
    build: .
    environment:
      - ConnectionStrings__WebDB=server=db;port=3306;database=OrderWeb;uid=root;pwd=1008;
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./keys:/root/.aspnet/DataProtection-Keys # ✅ 加入這一行掛載 DataProtection 金鑰
      - ./logs:/app/logs                         # （可選）你也可以加入 log 資料夾掛載
    restart: always

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1008
      MYSQL_DATABASE: OrderWeb
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
