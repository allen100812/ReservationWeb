version: '3.9'

services:
  web:
    build: .
    environment:
      - ConnectionStrings__WebDB=server=db;port=3306;database=OrderWeb;user=root;password=1008;
    depends_on:
      - db
    ports:
      - "8080:80"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1008
      MYSQL_DATABASE: OrderWeb
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
